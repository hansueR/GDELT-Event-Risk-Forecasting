name: Daily online forecast

on:
  workflow_dispatch:
    inputs:
      data_bundle_url:
        description: "Optional zip/tar URL containing real data inputs such as features/, modeling/, results/"
        required: false
        default: ""
      model_table_url:
        description: "Optional direct URL for a prebuilt refreshed model table parquet"
        required: false
        default: ""
      event_features_file:
        description: "Path to daily event features; generated from model table when omitted"
        required: false
        default: "data/online/daily_event_features.parquet"
      prediction_history_url:
        description: "Optional URL to deployed dashboard/data/prediction_history.json"
        required: false
        default: ""
  schedule:
    - cron: "37 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      DATA_BUNDLE_URL: ${{ github.event.inputs.data_bundle_url || vars.ONLINE_DATA_BUNDLE_URL || '' }}
      ONLINE_MODEL_TABLE_URL: ${{ github.event.inputs.model_table_url || vars.ONLINE_MODEL_TABLE_URL || '' }}
      MODEL_TABLE: modeling/model_table_ddfe_root_country_clean_full.parquet
      EVENT_LONG_DIR: features/event_long_clean_full
      EVENT_FEATURES_FILE: ${{ github.event.inputs.event_features_file || 'data/online/daily_event_features.parquet' }}
      PREDICTION_HISTORY_URL: ${{ github.event.inputs.prediction_history_url || vars.PREDICTION_HISTORY_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare real data inputs
        run: |
          python src/online/prepare_ci_inputs.py \
            --output_dir . \
            --data_bundle_url "$DATA_BUNDLE_URL" \
            --model_table_url "$ONLINE_MODEL_TABLE_URL" \
            --model_table "$MODEL_TABLE" \
            --event_features_file "$EVENT_FEATURES_FILE"

      - name: Build refreshed model table when event history is available
        run: |
          if [ -d "$EVENT_LONG_DIR" ]; then
            PROJECT_ROOT="$PWD" \
            EVENT_LONG_DIR="$EVENT_LONG_DIR" \
            ONLINE_MODEL_TABLE="$MODEL_TABLE" \
            ONLINE_EVENT_FEATURES_FILE="$EVENT_FEATURES_FILE" \
            PYTHON_BIN=python \
            bash src/pipelines/build_online_model_table.sh
          elif [ -f "$MODEL_TABLE" ]; then
            python src/online/export_daily_event_features.py \
              --model_table "$MODEL_TABLE" \
              --output_file "$EVENT_FEATURES_FILE"
          else
            echo "Missing both event history directory ($EVENT_LONG_DIR) and prebuilt model table ($MODEL_TABLE)."
            echo "Configure ONLINE_DATA_BUNDLE_URL or ONLINE_MODEL_TABLE_URL with real data inputs."
            exit 1
          fi

      - name: Train online models from latest historical table
        run: |
          if [ ! -f "$MODEL_TABLE" ]; then
            echo "Missing model table: $MODEL_TABLE"
            echo "Provide the refreshed historical model table before running daily online forecasts."
            exit 1
          fi
          python src/online/train_online_models.py \
            --model_table "$MODEL_TABLE" \
            --output_dir artifacts/online

      - name: Build dashboard evaluation data
        run: |
          ARGS="--model_table $MODEL_TABLE --output_dir dashboard/data"
          if [ -d results ]; then
            ARGS="$ARGS --results_dir results"
          fi
          python src/dashboard/build_dashboard_data.py $ARGS

      - name: Restore prior prediction history
        run: |
          python src/online/fetch_prediction_history.py \
            --history_url "$PREDICTION_HISTORY_URL" \
            --output_file dashboard/data/prediction_history.json

      - name: Update latest online features
        run: |
          python src/online/update_online_data.py \
            --output_dir data/online \
            --feature_schema artifacts/online/feature_schema.json \
            --event_features_file "$EVENT_FEATURES_FILE"

      - name: Run daily inference
        run: |
          python src/online/run_daily_inference.py \
            --features data/online/latest_features.parquet \
            --artifact_dir artifacts/online \
            --output_dir dashboard/data

      - name: Backfill resolved actuals
        run: |
          python src/online/backfill_actuals.py \
            --history dashboard/data/prediction_history.json \
            --features data/online/latest_features.parquet

      - name: Validate dashboard data
        run: |
          python src/dashboard/validate_dashboard_data.py \
            --data_dir dashboard/data \
            --mode online

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
